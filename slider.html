<style>
/* One screen like the Oboe references: menu knob + brand, title with a round knob, the board, one status line. Single look on purpose. */
:root {
  --felt: #9CC3D5;
  --felt-stripe: #A7CBDB;
  --knob: #4F7F99;
  --outline: #10291F;
  --cream: #FFF5E1;
  --gold: #D9A53A;
  --gold-deep: #A87A1E;
  --red: #EE6A5A;
  --red-deep: #C24A3C;
  --blue: #3550A8;
  --blue-deep: #243A80;
  --yellow: #F2C14E;
  --green: #4FA36B;
  --muted: #2F5568;
  --ink: #10291F;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--display); font-size: 18px; line-height: 1.4;
  background-color: var(--felt);
  background-image: repeating-linear-gradient(135deg, var(--felt) 0 14px, var(--felt-stripe) 14px 17px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 20px; box-sizing: border-box;
}
.wrap { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; position: relative; }
.top { display: flex; align-items: center; gap: 16px; }
.brand { font-family: "Fredoka", "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif; font-weight: 600; font-size: 2.3rem; line-height: 1; letter-spacing: -.02em; color: var(--ink); display: inline-flex; align-items: baseline; padding-top: .2em; }
.brand .i { position: relative; }
.brand .i svg { position: absolute; left: 50%; top: .02em; width: .5em; height: .5em; transform: translate(-50%, -42%); }
.knob { flex: none; width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--outline); background: var(--knob); color: var(--cream); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 3px 4px 0 var(--outline); padding: 0; }
.knob:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--outline); }
.knob:disabled { opacity: .45; cursor: default; }
.knob:focus-visible, .item:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
.knob svg { width: 26px; height: 26px; }
.game { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding-block: 24px 40px; }
.titlerow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-weight: 700; font-size: 2.3rem; margin: 0; line-height: 1; }
.status { font-weight: 500; font-size: 1.4rem; text-align: center; margin: 0; min-height: 2.8em; text-wrap: balance; }
.menu { position: absolute; top: 66px; left: 0; z-index: 5; width: min(320px, 100%); background: var(--felt); border: 3px solid var(--outline); border-radius: 20px; box-shadow: 4px 6px 0 var(--outline); padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.menu[hidden] { display: none; }
.item { font: inherit; font-size: 1.15rem; text-align: left; color: var(--ink); background: none; border: 0; border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.item:hover { background: var(--felt-stripe); }
.item[aria-current="true"]::after { content: "  ✓"; color: var(--gold); }
.sep { height: 2px; background: var(--outline); margin: 4px 8px; opacity: .6; }
.again { align-self: center; font: inherit; font-weight: 700; font-size: 1.25rem; min-height: 58px; padding: 10px 28px; border-radius: 999px; border: 3px solid var(--outline); background: var(--gold); color: var(--outline); cursor: pointer; box-shadow: 3px 4px 0 var(--outline); }
.again:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--outline); }
.again:focus-visible { outline: 4px solid var(--cream); outline-offset: 3px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.btnrow:not(:has(button:not([hidden]))) { display: none; }
.btnrow .again { font-size: 1.1rem; padding: 10px 22px; }
.again.alt { background: var(--cream); }
.note { color: var(--muted); font-size: .95rem; margin: 0; text-align: center; overflow-wrap: anywhere; }
.pop { animation: pop .28s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { transform: scale(.6); opacity: .3; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
@media (max-width: 400px) { h1 { font-size: 2rem; } .status { font-size: 1.25rem; } .brand { font-size: 2rem; } }
#board { width: 100%; max-width: 400px; align-self: center; height: auto; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#board .tile.live { cursor: pointer; }
#board .tile:focus { outline: none; }
#board .tile.live:hover .face { fill: #FFFFFF; }
#board .tile.live:focus-visible .face { stroke: var(--gold); stroke-width: 6; }
.star-tile { animation-delay: .18s; animation-fill-mode: both; }

</style>

<body>
<div class="wrap">
  <div class="top">
    <button class="knob" id="menubtn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
    </button>
    <span class="brand" role="img" aria-label="Klik"><span>k</span><span>l</span><span class="i">ı<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 C22 14 26 18 38 20 C26 22 22 26 20 38 C18 26 14 22 2 20 C14 18 18 14 20 2 Z" fill="#D9A53A" stroke="#10291F" stroke-width="2.5" stroke-linejoin="round"/></svg></span><span>k</span></span>
  </div>
  <div class="menu" id="menu" hidden></div>
  <div class="game">
    <div class="titlerow">
      <h1>Tile Slider</h1>
      <button class="knob" id="roundbtn" type="button" aria-label="New round">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>
      </button>
    </div>
    <svg id="board" role="group" aria-label="Tile slider board"></svg>
    <p class="status" id="status" role="status" aria-live="polite">Opening the game…</p>
    <div class="btnrow">
      <button class="again" id="invite" type="button" hidden>Invite a friend</button>
      <button class="again alt" id="practice" type="button" hidden>Play solo</button>
      <button class="again" id="friend" type="button" hidden>Play with a friend</button>
    </div>
    <p class="note" id="invitelink" hidden></p>
    <button class="again" id="again" type="button" hidden>Play another round?</button>
    <p class="note" id="net" hidden></p>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const other = (p) => (p === "a" ? "b" : "a");
  const table = (location.hash.slice(1).replace(/[^A-Za-z0-9-]/g, "") || "main").slice(0, 40);
  const SVGNS = "http://www.w3.org/2000/svg";
  function svg(tag, attrs, parent) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; }
  const rnd = (n) => Math.floor(Math.random() * n);
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- shared shell state ----------
  let mode = "loading";            // "online" | "practice"
  let state = null, shared = null, ref = null, db0 = null, myId = null, loaded = false;
  let chain = Promise.resolve(), botTimer = null;

  function localId() {
    try { let v = localStorage.getItem("klik-id"); if (!v) { v = "p" + Math.random().toString(36).slice(2, 10); localStorage.setItem("klik-id", v); } return v; }
    catch { return "p" + Math.random().toString(36).slice(2, 10); }
  }
  function net(text) { $("net").textContent = text || ""; $("net").hidden = !text; }
  const mySeat = () => !state ? null : mode === "practice" ? "a" : state.seats.a && state.seats.a.id === myId ? "a" : state.seats.b && state.seats.b.id === myId ? "b" : null;
  const bothSeated = () => !!(state && state.seats.a && state.seats.b);
  const watching = () => mode === "online" && loaded && state && !mySeat() && bothSeated();
  const waitingForFriend = () => mode === "online" && loaded && mySeat() && !bothSeated();

  function commit(next) {
    state = next; render();
    if (mode !== "online" || !ref) return;
    chain = chain.then(() => ref.set(next)).then(() => net("")).catch((e) => {
      net(e && (e.code === "invalid_argument" || e.code === "permission_denied" || e.code === "not_granted")
        ? "You can watch but not play. Ask the person who sent this game for Contributor access."
        : "That move didn't save. Check the internet connection and try again.");
    });
  }
  function update(fn) { if (!state) return; const s = clone(state); if (fn(s) === false) return; commit(s); scheduleBot(); }

  // ---------- Tile Slider, co-op: one board, take turns, beat the target ----------
  const SOLVED = "123456780";
  const ADJ = [[1,3],[0,2,4],[1,5],[0,4,6],[1,3,5,7],[2,4,8],[3,7],[4,6,8],[5,7]];
  const slide = (t, i) => { const z = t.indexOf("0"); if (!ADJ[z].includes(i)) return null; const a = t.split(""); a[z] = a[i]; a[i] = "0"; return a.join(""); };
  const home = (t) => { let k = 0; for (let i = 0; i < 8; i++) if (t[i] === SOLVED[i]) k++; return k; };
  // Every arrangement's distance from solved, worked out once (181,440 of them), so any level can be dealt instantly.
  let byDist = null;
  function distTable() {
    if (byDist) return byDist;
    const dist = new Map([[SOLVED, 0]]); let front = [SOLVED]; byDist = [[SOLVED]];
    for (let d = 1; front.length; d++) {
      const next = [];
      for (const t of front) { const z = t.indexOf("0"); for (const j of ADJ[z]) { const u = slide(t, j); if (!dist.has(u)) { dist.set(u, d); next.push(u); } } }
      if (next.length) byDist[d] = next;
      front = next;
    }
    return byDist;
  }
  // Level 1 is 5-7 moves; each level adds three, up to level 6 (20-22 moves).
  const MAXLEVEL = 6;
  const range = (lv) => [5 + 3 * (lv - 1), 7 + 3 * (lv - 1)];
  function deal(lv) {
    const [lo, hi] = range(lv), d = lo + rnd(hi - lo + 1), pool = distTable()[d];
    return { t: pool[rnd(pool.length)], best: d };
  }
  let drawnKey = null, dragDone = 0;
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const G = {
    key: "slider",
    seatName: { a: "player 1", b: "player 2" },
    practiceLabel: "Play solo",
    practiceB: false,
    intro: "Order 1 to 8 together, taking turns.",
    valid: (d) => d && d.v === 1 && typeof d.tiles === "string" && d.tiles.length === 9,
    fresh(prev) {
      const was = prev && prev.level || 1;
      const level = prev && prev.over && prev.moves <= prev.target ? Math.min(MAXLEVEL, was + 1) : was;
      const { t, best } = deal(level);
      const starter = prev ? (prev.moves ? other(prev.starter) : prev.starter) : "a";
      return { v: 1, level, tiles: t, target: best, moves: 0, turn: starter, starter, last: -1, over: false,
               seats: prev ? clone(prev.seats) : { a: null, b: null } };
    },
    started: (s) => s.moves > 0,
    againText: (s) => (s.moves <= s.target ? ((s.level || 1) < MAXLEVEL ? `Try level ${(s.level || 1) + 1}` : "Play another round?") : `Try level ${s.level || 1} again`),
    over: (s) => s.over,
    waitText: () => `Level ${state.level || 1}. Target is ${state.target} moves.`,
    status() { const lv = `Level ${state.level || 1}. `; const t = G.status0(); return state.over && state.moves <= state.target && (state.level || 1) >= MAXLEVEL ? t + " Top level!" : lv + t; },
    status0() {
      const s = state, me = mySeat();
      if (s.over) {
        const who = mode === "practice" ? "Solved" : "Solved together";
        if (s.moves < s.target) return `${who} in ${s.moves} moves. Better than the target!`;
        if (s.moves === s.target) return `${who} in ${s.moves} moves. Right on target!`;
        return `${who} in ${s.moves} moves. Target was ${s.target}.`;
      }
      const line = `${s.moves} ${s.moves === 1 ? "move" : "moves"}. Target is ${s.target}.`;
      if (mode === "practice") return s.moves ? line : `Target is ${s.target} moves.`;
      if (!s.moves) return s.turn === me ? `Target is ${s.target} moves. Take turns, you start.` : `Target is ${s.target} moves. Take turns, your friend starts.`;
      return (s.turn === me ? "Your move. " : "Your friend's move. ") + line;
    },
    canMove() {
      if (!state || state.over) return false;
      if (mode === "practice") return true;
      return bothSeated() && mySeat() === state.turn;
    },
    draw() {
      const board = $("board"); board.replaceChildren();
      const S = 96, gap = 8, pad = 16, depth = 8, W = 3 * S + 2 * gap + 2 * pad;
      board.setAttribute("viewBox", `0 0 ${W + depth} ${W + depth}`);
      svg("rect", { x: depth, y: depth, width: W, height: W, rx: 26, fill: "var(--outline)" }, board);
      svg("rect", { x: 0, y: 0, width: W, height: W, rx: 26, fill: "#C9473C", stroke: "var(--outline)", "stroke-width": 4 }, board);
      svg("rect", { x: pad - 4, y: pad - 4, width: W - 2 * pad + 8, height: W - 2 * pad + 8, rx: 14, fill: "#6E2420" }, board);
      const t = state ? state.tiles : SOLVED, act = G.canMove(), z = t.indexOf("0");
      const key = state ? t + "|" + state.moves : "", slideNow = !!state && drawnKey !== null && key !== drawnKey && state.moves > 0;
      drawnKey = key;
      for (let i = 0; i < 9; i++) {
        const v = t[i]; if (v === "0") continue;
        const r = Math.floor(i / 3), c = i % 3, x = pad + c * (S + gap), y = pad + r * (S + gap);
        const live = act && ADJ[z].includes(i);
        const g = svg("g", { class: "tile" + (live ? " live" : ""), role: "button", tabindex: live ? "0" : "-1",
          "aria-label": `Tile ${v}${live ? ", slide it" : ""}` }, board);
        // Slide the tile that just moved from its old square, on both phones.
        if (slideNow && state.last === i && state.from != null && g.animate && !reduceMotion) {
          const fr = Math.floor(state.from / 3), fc = state.from % 3;
          const left = dragDone ? 1 - dragDone : 1;   // a drag already covered part of the way
          g.animate([{ transform: `translate(${(fc - c) * (S + gap) * left}px, ${(fr - r) * (S + gap) * left}px)` }, { transform: "translate(0px, 0px)" }],
            { duration: Math.max(60, 170 * left), easing: "cubic-bezier(.2,.8,.3,1)" });
        }
        if (slideNow) dragDone = 0;
        if (state && state.over && i === 7) {
          // The finished picture: a red star tile fills the 9th square.
          const sx = pad + 2 * (S + gap), sy = pad + 2 * (S + gap);
          const sg = svg("g", { class: "star-tile pop", "aria-label": "Star tile, solved" }, board);
          svg("rect", { x: sx + 3, y: sy + 4, width: S, height: S, rx: 14, fill: "var(--outline)" }, sg);
          svg("rect", { x: sx, y: sy, width: S, height: S, rx: 14, fill: "#D8483C", stroke: "var(--outline)", "stroke-width": 3 }, sg);
          const cx = sx + S / 2, cy = sy + S / 2 + 2, R = 30, r2 = 12.5, pts = [];
          for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + (k * Math.PI) / 5, rr = k % 2 ? r2 : R; pts.push(`${(cx + rr * Math.cos(a)).toFixed(1)},${(cy + rr * Math.sin(a)).toFixed(1)}`); }
          svg("polygon", { points: pts.join(" "), fill: "var(--cream)", stroke: "var(--outline)", "stroke-width": 2.5, "stroke-linejoin": "round" }, sg);
        }
        svg("rect", { x: x + 3, y: y + 4, width: S, height: S, rx: 14, fill: "var(--outline)" }, g);
        svg("rect", { class: "face", x, y, width: S, height: S, rx: 14, fill: "var(--cream)", stroke: "var(--outline)", "stroke-width": 3 }, g);
        const tx = svg("text", { x: x + S / 2, y: y + S / 2 + 18, "text-anchor": "middle", "font-size": 52, "font-weight": 700, "font-family": "Fraunces, Georgia, serif", fill: "#B3362C" }, g);
        tx.textContent = v;
        if (live) {
          const go = () => G.move(i);
          g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
          // Drag the tile toward the gap with a finger or mouse; a plain tap also slides it.
          const D = S + gap, dx = (z % 3) - c, dy = Math.floor(z / 3) - r;
          let start = null, frac = 0;
          g.addEventListener("pointerdown", (e) => {
            start = { x: e.clientX, y: e.clientY, k: board.viewBox.baseVal.width / board.getBoundingClientRect().width, moved: 0 };
            frac = 0; g.setPointerCapture(e.pointerId); e.preventDefault();
          });
          g.addEventListener("pointermove", (e) => {
            if (!start) return;
            const ex = e.clientX - start.x, ey = e.clientY - start.y;
            start.moved = Math.max(start.moved, Math.hypot(ex, ey));
            frac = Math.min(1, Math.max(0, ((ex * dx + ey * dy) * start.k) / D));
            g.style.transform = `translate(${dx * D * frac}px, ${dy * D * frac}px)`;
          });
          const end = () => {
            if (!start) return;
            const tap = start.moved < 8; start = null;
            if (tap || frac > 0.35) { dragDone = tap ? 0 : frac; go(); return; }
            g.style.transform = "";
            if (g.animate && frac > 0) g.animate([{ transform: `translate(${dx * D * frac}px, ${dy * D * frac}px)` }, { transform: "translate(0px, 0px)" }], { duration: 120, easing: "ease-out" });
          };
          g.addEventListener("pointerup", end);
          g.addEventListener("pointercancel", () => { start = null; g.style.transform = ""; });
        }
      }
    },
    move(i) {
      if (!G.canMove()) return;
      update((s) => {
        const z = s.tiles.indexOf("0"), u = slide(s.tiles, i); if (!u) return false;
        s.tiles = u; s.moves++; s.last = z; s.from = i; s.turn = other(s.turn);
        if (u === SOLVED) s.over = true;
      });
    },
  };


  // ---------- seats and rounds ----------
  function newRound() {
    clearTimeout(botTimer);
    const s = G.fresh(state);
    commit(s); scheduleBot();
  }
  function takeSeat(seat) {
    const s = state ? clone(state) : G.fresh(null);
    for (const k of ["a", "b"]) if (s.seats[k] && s.seats[k].id === myId) s.seats[k] = null;
    s.seats[seat] = { id: myId };
    commit(s);
  }
  function autoSeat() {
    if (mode !== "online" || !loaded || mySeat()) return;
    if (!state) return takeSeat("a");
    if (!state.seats.a) return takeSeat("a");
    if (!state.seats.b) return takeSeat("b");
  }
  function scheduleBot() {
    clearTimeout(botTimer);
    if (mode !== "practice" || !G.bot || !state) return;
    const step = G.bot(state);
    if (!step) return;
    botTimer = setTimeout(() => { if (mode === "practice") update(step); }, G.botDelay || 650);
  }
  function startPractice() { clearTimeout(botTimer); mode = "practice"; state = G.fresh(null); state.seats = { a: { id: "me" }, b: G.practiceB === false ? null : { id: "bot" } }; render(); scheduleBot(); }
  function startOnline() { clearTimeout(botTimer); mode = "online"; state = shared; render(); autoSeat(); }

  // ---------- menu ----------
  function item(label, fn, current) {
    const b = document.createElement("button");
    b.className = "item"; b.type = "button"; b.textContent = label;
    if (current) b.setAttribute("aria-current", "true");
    b.addEventListener("click", () => { closeMenu(); fn(); });
    return b;
  }
  function buildMenu() {
    const m = $("menu"); m.replaceChildren();
    m.append(item("Play another round", newRound));
    const sep = document.createElement("div"); sep.className = "sep"; m.append(sep);
    if (db0) m.append(item("Play on two phones", startOnline, mode === "online"));
    m.append(item(G.practiceLabel, startPractice, mode === "practice"));
    if (watching()) { m.append(item(`Take ${G.seatName.a}'s place`, () => takeSeat("a"))); m.append(item(`Take ${G.seatName.b}'s place`, () => takeSeat("b"))); }
  }
  function openMenu() { buildMenu(); $("menu").hidden = false; $("menubtn").setAttribute("aria-expanded", "true"); const f = $("menu").querySelector("button"); if (f) f.focus(); }
  function closeMenu() { $("menu").hidden = true; $("menubtn").setAttribute("aria-expanded", "false"); }
  $("menubtn").addEventListener("click", () => ($("menu").hidden ? openMenu() : closeMenu()));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
  document.addEventListener("click", (e) => { if (!$("menu").hidden && !e.target.closest("#menu") && !e.target.closest("#menubtn")) closeMenu(); });

  // ---------- render ----------
  let confirmNew = false, confirmTimer = null;
  function render() {
    G.draw();
    let text;
    if (!state) text = mode === "online" && !loaded ? "Opening the game…" : G.intro;
    else if (watching()) text = "Two people are playing. You're watching.";
    else if (waitingForFriend()) text = G.waitText(mySeat());
    else text = G.status();
    $("status").textContent = confirmNew ? "Tap again to start a new round." : text;
    $("roundbtn").disabled = mode === "online" && !mySeat();
    $("again").hidden = !(state && G.over(state) && (mode !== "online" || mySeat()));
    $("again").textContent = (state && G.againText && G.againText(state)) || "Play another round?";
    $("invite").hidden = !waitingForFriend();
    $("practice").hidden = !waitingForFriend();
    $("friend").hidden = !(mode === "practice" && db0);
    if ($("invite").hidden) $("invitelink").hidden = true;
    if (!$("menu").hidden) buildMenu();
  }
  $("again").addEventListener("click", () => (G.again ? G.again() : newRound()));
  $("practice").addEventListener("click", startPractice);
  $("friend").addEventListener("click", startOnline);
  const GAME_LINK = window.KLIK_INVITE_LINK(table);
  $("invite").addEventListener("click", () => {
    const show = (msg) => { const n = $("invitelink"); n.textContent = msg; n.hidden = false; };
    const fallback = () => show("Copy this link and send it on WhatsApp: " + GAME_LINK);
    try {
      navigator.clipboard.writeText(GAME_LINK).then(() => { $("invite").textContent = "Link copied!"; show("Paste it in your WhatsApp chat. " + GAME_LINK); setTimeout(() => { $("invite").textContent = "Invite a friend"; }, 2500); }, fallback);
    } catch { fallback(); }
  });
  // The round arrow starts a new round for both players. Mid-round it asks for a second tap first.
  $("roundbtn").addEventListener("click", () => {
    if (!state || (G.done ? G.done(state) : G.over(state)) || !G.started(state) || confirmNew) { confirmNew = false; clearTimeout(confirmTimer); newRound(); return; }
    confirmNew = true; render();
    confirmTimer = setTimeout(() => { confirmNew = false; render(); }, 3000);
  });

  // ---------- connect ----------
  async function start() {
    const claude = window.claude;
    if (!claude || !claude.use) return startPractice();
    const db = await claude.use("db");
    if (!db) return startPractice();
    db0 = db; mode = "online";
    // Seats belong to a device, not an account, so two phones on the same Claude account still get both seats.
    myId = localId();
    ref = db.doc(G.key + "/" + table);
    const timer = setTimeout(() => { if (!loaded) net("Can't reach the game yet. Check the internet connection; it will keep trying."); }, 10000);
    ref.onSnapshot((snap) => {
      const firstLive = !loaded && !snap.metadata.fromCache;
      if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); net(""); }
      shared = snap.exists && G.valid(snap.data()) ? clone(snap.data()) : null;
      if (mode === "online") { state = shared; render(); if (firstLive) autoSeat(); }
    }, () => { clearTimeout(timer); net("The game connection stopped. Reload the page to reconnect."); });
    render();
  }
  render();
  start().catch(() => startPractice());
})();
</script>
</body>
</html>
