<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Klik</title>
<meta name="description" content="Tiny games, together.">
<meta property="og:title" content="Play Klik with me">
<meta property="og:description" content="Tiny games, together.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap">
<style>
/* Layout: a full-screen vertical feed. One game fills the screen; swipe up for the next. Both phones in a session follow the same game. */
:root {
  --ink: #10291F;
  --cream: #FFF5E1;
  --gold: #D9A53A;
  --round: "Fredoka", "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); overscroll-behavior: none; }
.track { height: 100%; transition: transform .45s cubic-bezier(.2, .8, .2, 1); will-change: transform; }
.slide { height: 100%; position: relative; }
.slide iframe { border: 0; width: 100%; height: 100%; display: block; background: var(--ink); }
.dots { position: fixed; right: max(6px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 3; }
.dot { width: 22px; height: 22px; border: 0; background: none; padding: 0; cursor: pointer; display: grid; place-items: center; }
.dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cream); opacity: .45; border: 2px solid var(--ink); transition: all .2s; }
.dot[aria-current="true"]::before { opacity: 1; background: var(--gold); width: 10px; height: 18px; border-radius: 6px; }
.dot:focus-visible { outline: 3px solid var(--gold); border-radius: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; z-index: 4;
  font-family: var(--round); font-weight: 600; font-size: 1rem; color: var(--ink); background: var(--cream); border: 3px solid var(--ink); border-radius: 999px;
  padding: 10px 18px; box-shadow: 0 4px 0 var(--ink); transition: all .25s; pointer-events: none; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.tap { pointer-events: auto; cursor: pointer; }
.join { position: fixed; inset: 0; z-index: 6; background: rgba(16, 41, 31, .72); display: grid; place-items: center; padding: 16px; }
.join[hidden] { display: none; }
.card { width: min(380px, 100%); background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink); padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; font-family: var(--round); }
.card h2 { margin: 0; font-weight: 600; font-size: 1.45rem; line-height: 1.2; text-wrap: balance; }
.card input { font: inherit; font-size: 1.25rem; min-height: 54px; padding: 6px 14px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; color: var(--ink); width: 100%; box-sizing: border-box; }
.card button { font: inherit; font-size: 1.2rem; min-height: 54px; border-radius: 999px; border: 3px solid var(--ink); background: var(--gold); color: var(--ink); box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
.card input:focus-visible, .card button:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .track, .toast, .dot::before { transition: none; } }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js?v=7a1cef1c"></script>
<script src="klik-sync.js?v=7a1cef1c"></script>
</head>
<body>
<div class="track" id="track"></div>
<button class="toast" id="toast" type="button" tabindex="-1"></button>
<div class="join" id="join" hidden>
  <form class="card" id="joinform">
    <h2 id="jointitle">You're invited to play. What's your name?</h2>
    <input id="joinname" type="text" maxlength="20" autocomplete="given-name" placeholder="Your name" aria-label="Your name" required>
    <button type="submit">Join</button>
  </form>
</div>
<script>
(() => {
  const GAMES = [
    { key: "hex", name: "Hex" },
    { key: "othello", name: "Othello" },
    { key: "slider", name: "Tile Slider" },
    { key: "eye", name: "Bird's Eye View" }
  ];
  const $ = (id) => document.getElementById(id);
  const code = location.hash.slice(1).replace(/[^A-Za-z0-9-]/g, "").slice(0, 40);   // klik-sync.js makes one if the link had none
  const action = new URLSearchParams(location.search).get("do");   // from Home: "invite" or "solo"
  let solo = action === "solo";
  const wanted = GAMES.findIndex((g) => g.key === new URLSearchParams(location.search).get("g"));
  let cur = -1, ref = null, toastTimer = null, hintShown = false;

  // ---------- names: one small shared doc per session, {deviceId: name} ----------
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  let myId = store.get("klik-id");
  if (!myId) { myId = "p" + Math.random().toString(36).slice(2, 10); store.set("klik-id", myId); }
  let names = {}, namesRef = null, namesLoaded = false;
  const listeners = [];
  const clean = (n) => String(n || "").replace(/\s+/g, " ").trim().slice(0, 20);
  const friendName = () => { for (const k in names) if (k !== myId && names[k]) return names[k]; return ""; };
  function setName(n) {
    n = clean(n); if (!n) return;
    store.set("klik-name", n);
    names = Object.assign({}, names, { [myId]: n });
    listeners.forEach((f) => { try { f(); } catch {} });
    if (namesRef) namesRef.set(names).catch(() => {});
  }

  // Build one slide per game. Frames load lazily: the current game and the next one.
  const slides = GAMES.map((g, i) => {
    const s = document.createElement("section"); s.className = "slide"; s.setAttribute("aria-label", g.name);
    $("track").append(s);
    return s;
  });
  function ensure(i) {
    const s = slides[i];
    if (s.firstChild) return;
    const f = document.createElement("iframe");
    f.title = GAMES[i].name;
    f.src = `${GAMES[i].key}.html#${code}-${GAMES[i].key}`;   // each game in this session gets its own table, shared by both phones
    f.allow = "clipboard-write; web-share";
    f.addEventListener("load", () => { if (solo) whenFrame(f, (w) => { const b = w.document.getElementById("practice"); if (b && !b.hidden) { b.click(); return true; } }); });
    s.append(f);
  }
  // Wait for something inside a game frame (it needs a moment to load its table), then act once.
  function whenFrame(f, act, tries = 60) {
    let w = null; try { w = f.contentWindow; } catch {}
    if (w && w.document && w.document.readyState !== "loading" && act(w)) return;
    if (tries > 0) setTimeout(() => whenFrame(f, act, tries - 1), 150);
  }
  function toast(text, onTap) {
    const t = $("toast"); t.textContent = text; t.classList.add("on"); t.classList.toggle("tap", !!onTap);
    t.onclick = onTap || null;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on", "tap"), 3200);
  }
  function go(i, share, fromFriend) {
    i = ((i % GAMES.length) + GAMES.length) % GAMES.length;
    if (i === cur) return;
    cur = i;
    ensure(i); ensure((i + 1) % GAMES.length);
    $("track").style.transform = `translateY(${-i * 100}%)`;
    document.title = `Klik · ${GAMES[i].name}`;
    if (fromFriend) toast(`${friendName() || "Your friend"} switched to ${GAMES[i].name}`);
    else if (!hintShown) { hintShown = true; const n = GAMES[(i + 1) % GAMES.length].name; toast(`Swipe up for ${n}`, () => step(1)); }
    if (share && ref) ref.set({ i, at: Date.now() }).catch(() => {});
  }
  function step(d) { go(cur + d, true); }

  window.KLIK_FEED = { link: () => location.origin + location.pathname + "#" + code, step, games: GAMES, current: () => cur, jump: (i) => go(i, true),
    myName: () => names[myId] || "", friendName, setName, savedName: () => store.get("klik-name") || "",
    onNames: (f) => { listeners.push(f); } };
  document.addEventListener("keydown", (e) => { if (e.key === "ArrowDown" || e.key === "PageDown") step(1); if (e.key === "ArrowUp" || e.key === "PageUp") step(-1); });
  window.addEventListener("resize", () => { $("track").style.transform = `translateY(${-cur * 100}%)`; });

  go(wanted >= 0 ? wanted : 0, false);
  if (action === "invite") whenFrame(slides[cur].firstChild, (w) => { if (w.KLIK_ASK_INVITE) { w.KLIK_ASK_INVITE(); return true; } });
  if (location.search) history.replaceState(null, "", location.pathname + location.hash);   // a reload later follows the session, not the old pick

  // The friend's join card: "Spandana invited you to play. What's your name?"
  $("joinform").addEventListener("submit", (e) => {
    e.preventDefault(); const n = clean($("joinname").value); if (!n) { $("joinname").focus(); return; }
    setName(n); $("join").hidden = true;
  });

  // Keep both phones on the same game.
  window.claude.use("db").then((db) => {
    if (!db) return;
    namesRef = db.doc("names/" + code);
    namesRef.onSnapshot((snap) => {
      const before = friendName();
      names = snap.exists && snap.data() && typeof snap.data() === "object" ? Object.assign({}, snap.data()) : {};
      const first = !namesLoaded; namesLoaded = true;
      // Someone else started this session and this phone isn't named here yet: this phone is the friend joining.
      if (!names[myId] && friendName()) {
        const saved = store.get("klik-name");
        if (saved) setName(saved);
        else if (first || $("join").hidden) {
          $("jointitle").textContent = `${friendName()} invited you to play. What's your name?`;
          $("join").hidden = false; setTimeout(() => $("joinname").focus(), 50);
        }
      }
      const after = friendName();
      if (after && after !== before && !first) toast(`${after} joined`);
      listeners.forEach((f) => { try { f(); } catch {} });
    });
    ref = db.doc("feed/" + code);
    let first = true;
    ref.onSnapshot((snap) => {
      const d = snap.exists ? snap.data() : null;
      if (first) { first = false; if (!d || (wanted >= 0 && d.i !== wanted)) { ref.set({ i: cur, at: Date.now() }).catch(() => {}); return; } }   // a game picked on the home page wins, and the friend follows
      if (d && typeof d.i === "number" && d.i !== cur) go(d.i, false, true);
    });
  });
})();
</script>
</body>
</html>
